<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="libreGrad" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7f1d1d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#libreGrad)" filter="url(#shadow)" />
  
  <!-- File Sheet Outline -->
  <path d="M168 128H288L360 200V384H168V128Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="20" stroke-linejoin="round" />
  <path d="M288 128V200H360" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>
  
  <!-- "PDF" Text & Privacy Shield -->
  <g transform="translate(180, 248)">
    <!-- Shield / Lock open -->
    <path d="M76 10 C 100 10, 130 0, 130 0 C 130 0, 160 10, 184 10 C 184 60, 170 105, 130 120 C 90 105, 76 60, 76 10 Z" fill="#ffffff" />
    <!-- Checkmark inside shield -->
    <path d="M108 55 L 124 72 L 152 42" stroke="#dc2626" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Bottom Accent Bars -->
  <rect x="180" y="320" width="100" height="14" rx="7" fill="#ffffff" />
  <rect x="180" y="344" width="60" height="14" rx="7" fill="#fca5a5" />
</svg>
